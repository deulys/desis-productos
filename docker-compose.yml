services:
  app:
    build: .
    ports:
      - "8080:8000"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: desis_productos
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: desis_productos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/crear_tablas.sql:/docker-entrypoint-initdb.d/01_crear_tablas.sql:ro
      - ./sql/cargar_datos_iniciales.sql:/docker-entrypoint-initdb.d/02_cargar_datos_iniciales.sql:ro

volumes:
  postgres_data:
